name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Core, no optional features: must build and pass with thiserror alone.
      - run: cargo build --all-targets --no-default-features
      - run: cargo test
      - run: cargo test --features decider
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features decider -- -D warnings
      - run: cargo fmt --all -- --check

  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # One abi3 wheel serves CPython 3.10+; test both ends of that range.
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install maturin pytest
      - run: cargo clippy -p typed-ask-py --all-targets -- -D warnings
      - run: cargo clippy -p typed-ask-py --all-targets --features decider -- -D warnings
      - name: Build abi3 wheel
        working-directory: python
        run: maturin build --release --out dist
      - name: Install wheel and run pytest
        working-directory: python
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pytest -q tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: python/dist/*.whl
